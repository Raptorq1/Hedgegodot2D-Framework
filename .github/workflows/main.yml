name: Godot 4 Migration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Godot 4.3 Headless
      - name: Set up Godot 4.3
        uses: firebelley/godot-export@v6.0.0
        with:
          godot-version: "4.3.0"
          use-mono: false

      
