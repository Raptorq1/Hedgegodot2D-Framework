name: Convert Godot 3.6 to 4.x

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Set up Godot 4
      uses: firebelley/godot-action@v2
      with:
        version: 4.2.2
        use-mono: false

    - name: Run Godot to auto-convert project
      run: godot --headless --editor --quit

    - name: Commit converted project
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --exit-code || git commit -m "Convert project from Godot 3.6 to 4.2.2"
        git push
