name: Convert Godot 3.6 Project to Godot 4

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v3

    - name: Download Godot 4.2.2
      run: |
        curl -L -o godot.zip https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_linux.x86_64.zip
        unzip godot.zip -d godot
        mv godot/Godot_v4.2.2-stable_linux.x86_64 godot/godot
        chmod +x godot/godot

    - name: Convert the project using Godot 4
      run: |
        echo "Starting Godot 4 conversion..."
        godot/godot --headless --editor --quit || true

    - name: Commit converted project files
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add -A
        git diff --cached --exit-code || git commit -m "Auto-converted project from Godot 3.6 to Godot 4"
        git push